name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: smartcommerce
          POSTGRES_USER: smartcommerce
          POSTGRES_PASSWORD: smartcommerce-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcommerce -d smartcommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven

      - name: Create test database
        env:
          PGPASSWORD: smartcommerce-ci-password
        run: |
          psql -h localhost -U smartcommerce -d smartcommerce \
            -c "CREATE DATABASE smartcommerce_test;"

      - name: Build, test and analyze
        working-directory: backend
        env:
          POSTGRES_PASSWORD: smartcommerce-ci-password
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=mohammadAziz-dev_SmartCommerce